<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="grad" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0053db" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0d1322" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#080e1d" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ed5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080e1d" />
  <rect width="1200" height="630" fill="url(#grad)" />
  <rect x="24" y="24" width="1152" height="582" rx="32" fill="none" stroke="#242a3a" stroke-width="2" />

  <!-- Logo Badge -->
  <g transform="translate(100, 100)">
    <rect width="96" height="96" rx="24" fill="#151b2b" stroke="#38bdf8" stroke-width="2" />
    <text x="48" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#8ed5ff" text-anchor="middle">TE</text>
  </g>

  <!-- Brand Title -->
  <text x="220" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#dde2f8">T.E Digital</text>
  <text x="222" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#8ed5ff" letter-spacing="2">MARKETING • SOFTWARE • WEB SOLUTIONS</text>

  <!-- Main Headline in Arabic -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#dde2f8" dir="rtl">
    طارق عيد | حلول التسويق الرقمي وتطوير الويب
  </text>
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#bdc8d1" dir="rtl">
    إعلانات ممولة • إدارة سوشيال ميديا • برمجة مواقع وصفحات هبوط فائقة السرعة
  </text>

  <!-- Key Badges -->
  <g transform="translate(100, 460)">
    <rect width="260" height="64" rx="16" fill="#151b2b" stroke="#242a3a" stroke-width="1.5" />
    <text x="130" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#8ed5ff" text-anchor="middle">Paid Advertising</text>
  </g>
  <g transform="translate(380, 460)">
    <rect width="280" height="64" rx="16" fill="#151b2b" stroke="#242a3a" stroke-width="1.5" />
    <text x="140" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#8ed5ff" text-anchor="middle">Social Media Mgmt</text>
  </g>
  <g transform="translate(680, 460)">
    <rect width="280" height="64" rx="16" fill="#151b2b" stroke="#242a3a" stroke-width="1.5" />
    <text x="140" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#8ed5ff" text-anchor="middle">React &amp; Next.js Dev</text>
  </g>

  <!-- Subtle glow indicator -->
  <circle cx="1100" cy="100" r="8" fill="#38bdf8" />
  <circle cx="1100" cy="100" r="16" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
</svg>
